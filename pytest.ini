[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --timeout=120
markers =
    integration: exige PostgreSQL, .env válido e chave de API (RUN_INTEGRATION=1)
    web: testes da interface Streamlit
    security: verificações de segredos e prompt injection
    slow: testes de desempenho ou mais demorados
    skill: valida o skill de testes do projeto
filterwarnings =
    ignore::DeprecationWarning
